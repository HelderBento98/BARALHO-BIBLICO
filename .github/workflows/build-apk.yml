name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/baralho-biblico.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: baralho-biblico-apk
          path: out/baralho-biblico.apk

      - name: Publish APK to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Baralho Bíblico — APK (debug para testes)
          body: |
            APK de teste gerado automaticamente a partir da pasta `/android`.
            Para instalar no celular: baixe o arquivo e permita "instalar apps de fontes desconhecidas".
          files: out/baralho-biblico.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
